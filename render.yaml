services:
  - type: web
    name: orders-live
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health   # never touches the database
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OTEL_SERVICE_NAME
        value: orders-live
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://otelcol.monoscope.tech:4317
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: grpc
      # Neon connection string, set in the Render dashboard
      - key: DATABASE_URL
        sync: false
      # console = nothing runs until someone connects a key in the Demo Console (service can sleep)
      # burst   = also run one short burst every SIM_BURST_EVERY_MINUTES using the key below
      # continuous = steady traffic (will exhaust Neon's free compute)
      - key: DEMO_MODE
        value: burst
      # Only needed for burst/continuous. e.g. x-api-key=YOUR_KEY,deployment.environment=production
      - key: OTEL_RESOURCE_ATTRIBUTES
        sync: false
      - key: SIM_BURST_EVERY_MINUTES
        value: 15
      - key: SIM_BURST_JOURNEYS
        value: 15
      - key: SIM_BURST_SECONDS
        value: 60
      # Optional: require a passcode to use the console
      - key: DEMO_PASSCODE
        sync: false
